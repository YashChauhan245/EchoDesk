version: '3.8'

services:
  echodesk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echodesk-app
    restart: always
    ports:
      - "3001:3000" # Map host port 3001 to container port 3000 (prevents port 3000 conflicts)
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://echodesk-mongo:27017/echodesk
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
    depends_on:
      - echodesk-mongo
    networks:
      - echodesk-network

  echodesk-mongo:
    image: mongo:7.0
    container_name: echodesk-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - echodesk-network

networks:
  echodesk-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
